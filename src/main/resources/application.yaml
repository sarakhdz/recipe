spring:
  application:
    name: recipe
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:recipe_db}
    username: ${DB_USERNAME:recipe}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    username: ${APP_USERNAME:admin}
    password: ${APP_PASSWORD}
